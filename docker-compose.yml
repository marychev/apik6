services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      UVICORN_WORKERS: ${UVICORN_WORKERS}
      KAFKA_ENGINE_NUM_CONSUMERS: ${KAFKA_ENGINE_NUM_CONSUMERS}
      KAFKA_ENGINE_POLL_TIMEOUT_MS: ${KAFKA_ENGINE_POLL_TIMEOUT_MS}
      KAFKA_ENGINE_POLL_MAX_BATCH_SIZE: ${KAFKA_ENGINE_POLL_MAX_BATCH_SIZE}
      KAFKA_ENGINE_FLUSH_INTERVAL_MS: ${KAFKA_ENGINE_FLUSH_INTERVAL_MS}
      KAFKA_PRODUCER_LINGER_MS: ${KAFKA_PRODUCER_LINGER_MS}
      KAFKA_PRODUCER_BATCH_SIZE: ${KAFKA_PRODUCER_BATCH_SIZE}
      KAFKA_PRODUCER_COMPRESSION: ${KAFKA_PRODUCER_COMPRESSION}
      KAFKA_PRODUCER_ACKS: ${KAFKA_PRODUCER_ACKS}
      KAFKA_PRODUCER_IDEMPOTENT: ${KAFKA_PRODUCER_IDEMPOTENT}
    depends_on:
      kafka:
        condition: service_healthy
      # clickhouse:
      #   condition: service_started
    restart: on-failure

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS}
      KAFKA_NUM_NETWORK_THREADS: ${KAFKA_NUM_NETWORK_THREADS}
      KAFKA_NUM_IO_THREADS: ${KAFKA_NUM_IO_THREADS}
    ports:
      - "9092:9092"
      - "9093:9093"
    depends_on:
      - zookeeper
    # TCP-пробник через bash builtin — без запуска JVM-клиента, минимум CPU.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

